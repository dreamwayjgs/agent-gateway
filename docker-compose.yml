services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_FILE=/home/bun/data/data.db
      - WORKSPACE_DIR=/home/bun/workspace
      - MESSENGER=${MESSENGER:-telegram}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - DISCORD_ALLOWLIST=${DISCORD_ALLOWLIST:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./data:/home/bun/data
      - ./workspace:/home/bun/workspace
      - ./data/codex-auth:/home/bun/.codex
