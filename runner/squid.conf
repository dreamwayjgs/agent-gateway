# Step 10a — egress allowlist proxy (deny-by-default).
# Runner API has no route here except via this proxy; only listed
# destinations are reachable. Everything else is denied.
# Logs: minimal format only (time, client, URL, status) — no headers.

http_port 3128
pid_filename /tmp/squid.pid

acl SSL_ports port 443
acl Safe_ports port 443
acl CONNECT method CONNECT

# Model destinations measured in Step 10a (proxy log based, 2026-09-30).
# ChatGPT OAuth auth uses chatgpt.com backend, not api.openai.com.
# auth.openai.com: OAuth access-token refresh (reproduced with forced-expired copy).
acl allowlist dstdomain chatgpt.com ab.chatgpt.com auth.openai.com .oaiusercontent.com

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowlist
http_access deny all

cache deny all

logformat minimal %ts %>a %ru %Ss/%>Hs
access_log stdio:/dev/stdout minimal
cache_log /dev/null
